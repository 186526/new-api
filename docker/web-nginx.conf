server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Rsbuild emits content-hashed files below /static, so they can be cached
    # for a year and served without revalidation.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a client-side route: serve the shell and let the
    # router take over.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
