name: Publish metrics image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: metrics-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish metrics image
    if: github.repository == '186526/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve image tag
        id: version
        run: |
          echo "tag=metrics-$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "sha-${{ github.sha }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/186526/new-api:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/186526/new-api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=metrics-amd64
          cache-to: type=gha,scope=metrics-amd64,mode=max
          provenance: mode=max
          sbom: true

      - name: Image summary
        run: |
          echo "Pushed \`ghcr.io/186526/new-api:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
